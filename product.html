<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | E-COM PAK</title>
    <!-- Global stylesheet -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="fade-in">
    <!-- Header Sequence: Branding and Navigation -->
    <header class="site-header">
        <div class="header-left">
            <a href="./index.html" class="brand-logo">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z"/></svg>
                E-COM PAK
            </a>
        </div>
        <nav class="header-nav">
            <ul>
                <li><a href="./index.html#about">About Us</a></li>
                <li><a href="./index.html#policy">Policy</a></li>
                <li><a href="./index.html#shipping">Shipping</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <a href="tel:+92000000000" class="btn">Call Now</a>
            <div class="cart-icon">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span class="cart-badge" id="cart-counter">0</span>
            </div>
        </div>
    </header>

    <main class="product-detail-container" id="product-container">
        <!-- Injected via JS -->
    </main>

    <!-- Direct Order Pop-Up Modal -->
    <div class="modal-overlay" id="order-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h2 style="margin-bottom: 1.5rem; text-transform: uppercase;">Complete Your Order</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" required>
                </div>
                <div class="form-group">
                    <label for="phone">Active Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="address">Complete Shipping Address</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-group">
                    <label for="city">Destination City</label>
                    <input type="text" id="city" required>
                </div>

                <div class="invoice-summary">
                    <div class="invoice-row">
                        <span>Subtotal:</span>
                        <span id="invoice-subtotal">Rs. 0</span>
                    </div>
                    <div class="invoice-row">
                        <span>Shipping:</span>
                        <span>Rs. 0 (Free Delivery)</span>
                    </div>
                    <div class="invoice-row">
                        <span>Payment Method:</span>
                        <span>Cash on Delivery (COD)</span>
                    </div>
                    <div class="invoice-row invoice-total">
                        <span>Total:</span>
                        <span id="invoice-total">Rs. 0</span>
                    </div>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Confirm Order</button>
            </form>
        </div>
    </div>

    <!-- Global App Logic -->
    <script src="./js/main.js"></script>
    <!-- Product Page Specific Logic -->
    <script src="./js/product.js"></script>
</body>
</html>
